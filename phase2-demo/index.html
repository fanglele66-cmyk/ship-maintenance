<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能机舱 · 态势、事件与任务处置</title>
  <meta name="description" content="智能机舱：船舶与设备健康态势、系统测点、事件决策分流，以及派发任务的执行与结果回写。">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #0A1628;
      color: #E8F0FF;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app { width: 100%; height: 100%; }
    .boot-screen{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#f3f5f8;color:#52647b;font-size:15px}.boot-screen button{padding:9px 18px;border:1px solid #b49359;border-radius:5px;background:white;color:#936821;cursor:pointer}.boot-screen button[hidden]{display:none}
  </style>
</head>
<body>
  <div id="app"><div class="boot-screen" role="status"><p id="boot-label">正在加载工作台…</p><button id="boot-retry" hidden>重新加载</button></div></div>
  <script>
  (()=>{
   const build='__SHIP_BUILD_ID__',key='ship-recovery:'+build;
   let timer;
   function retry(){const url=new URL(location.href);url.searchParams.set('__refresh',Date.now().toString(36));location.replace(url.href)}
   function showFailure(){const label=document.getElementById('boot-label');if(label)label.textContent='页面暂未加载完成，请重试。';const button=document.getElementById('boot-retry');if(button){button.hidden=false;button.onclick=()=>{sessionStorage.removeItem(key);retry()}}}
   window.__shipRecover=error=>{
    if(/dynamically imported|module script|Loading chunk|Failed to fetch/i.test(String(error?.message||error))&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');retry();return}
    showFailure();
   };
   window.addEventListener('vite:preloadError',event=>{event.preventDefault();window.__shipRecover(event.payload)});
   window.addEventListener('error',event=>{if(event.target?.tagName==='SCRIPT')window.__shipRecover(new Error('Failed to fetch module script'))},true);
   window.addEventListener('ship:ready',()=>clearTimeout(timer),{once:true});
   timer=setTimeout(showFailure,15000);
   fetch('./build-version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{if(data?.version&&data.version!==build&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');retry()}}).catch(()=>{});
  })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
