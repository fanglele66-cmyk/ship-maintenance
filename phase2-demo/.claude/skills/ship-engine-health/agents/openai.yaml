interface:
  display_name: "船舶设备健康分析"
  short_description: "生成设备健康结果并返回态势欢迎或单设备详情"
  default_prompt: "Use $ship-engine-health to run health analysis or build situationWelcome/deviceDetail. For frontend prompts, keep the visible Chinese action outside and read action, shipId, shipName/deviceId, and Skill：$ship-engine-health from the single final <yincang> block. For either card branch, capture the deterministic command stdout only after exit 0, then require exactly three lines, exact card fences, valid schema-compliant JSON whose body closes with two braces, and one complete final/output_text block. Treat completeness validation as a silent internal gate: on success final output_text must equal captured stdout byte-for-byte and begin at byte 0 with the opening card marker; never prepend or append validation, progress, or success prose such as Script stdout integrity passed; never stream partial tool stdout, retype, reserialize, truncate, or repair JSON. If completeness validation fails, emit no partial JSON, retry the same builder once, and report failure if the retry is still invalid."
