<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>事件闭环分支图</title><style>
*{box-sizing:border-box}body{margin:0;font:13px "Microsoft YaHei","PingFang SC",sans-serif;color:#24344a;background:#fff}header{padding:18px 24px 14px;border-bottom:1px solid #e8edf5;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:18px;font-weight:600}nav{display:flex;gap:4px}button{font:inherit;cursor:pointer;border:1px solid #e1e7f0;background:white;border-radius:5px;color:#51647e;padding:6px 10px}button:hover{background:#f4f7fd}button[aria-pressed=true]{background:#edf3ff;color:#3765c2;border-color:#afc6f6}button:focus-visible{outline:2px solid #6b9af5;outline-offset:2px}.zoom{display:flex;gap:6px;align-items:center;margin-left:auto}.zoom output{width:40px;text-align:center;font-size:11px;color:#8493a9}.hint{padding:8px 24px;color:#8b97a9;font-size:11px;border-bottom:1px solid #f0f3f7}#viewport{height:calc(100dvh - 116px);min-height:400px;overflow:auto;touch-action:pan-x pan-y;cursor:grab;background:#fff}#viewport.dragging{cursor:grabbing}svg{display:block;overflow:visible}.edge{stroke:#8facf5;stroke-width:1.3;fill:none}.node text{font-size:13px;fill:#2e3d52;dominant-baseline:central}.node rect{fill:#fff;stroke:none;rx:4}.node.root rect{fill:#5e8ce5}.node.root text{fill:white;font-weight:600}.node.type rect{fill:#eff4ff}.node.type text{fill:#3562b3;font-weight:600}.node.end text{fill:#397f64}.node.ref{cursor:pointer}.node.ref text{fill:#597bbc}.node.ref:hover rect{fill:#f0f5ff}.node.active rect{fill:#fff4bd;stroke:#d9bd53;stroke-width:1.5}.node:focus{outline:none}.node:focus rect{stroke:#5984d2;stroke-width:2}.node.small text{font-size:12px;fill:#76869a}.edge-label{font-size:11px;fill:#8998ae}@media(max-width:700px){header{padding:12px;gap:10px}h1{width:100%;font-size:16px}nav button{padding:6px 8px}.zoom{margin-left:0}.hint{padding:8px 12px}#viewport{height:calc(100dvh - 160px)}}@media print{header{padding:6px}nav,.zoom,.hint{display:none}#viewport{height:auto!important;overflow:visible}svg{max-width:100%;height:auto!important}.edge{stroke:#7798e8}}
</style></head><body><header><h1>事件 → 闭环 · 分支图</h1><nav aria-label="事件类型"><button data-type="all" aria-pressed="true">全部</button><button data-type="alarm" aria-pressed="false">报警</button><button data-type="warning" aria-pressed="false">预警</button><button data-type="tracking" aria-pressed="false">异动跟踪</button></nav><div class="zoom"><button id="out" aria-label="缩小">−</button><output id="scale">100%</output><button id="in" aria-label="放大">＋</button><button id="fit">适应宽度</button><button id="reset">原始大小</button></div></header><div class="hint">从左向右阅读。蓝色“↩ / →”节点可跳转共用分支；闭环均由轮机长确认。拖动空白处平移，Ctrl / ⌘ + 滚轮缩放。</div><div id="viewport" tabindex="0" aria-label="可滚动的事件分支树"><svg id="tree" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="报警、预警和异动跟踪从事件出现到闭环的全部分支"></svg></div>
<script>
const n=(text,children=[],props={})=>({text,children,...props}),end=(text='人工确认闭环')=>n(text,[],{tone:'end'}),ref=(text,target)=>n(text,[],{target,tone:'ref'});
function eventBranch(type){const names={alarm:'报警事件出现',warning:'预警事件出现',tracking:'异动跟踪出现'},prefix=type+'-',tracking=type==='tracking';
const work=n('派发维修',[n('按本次批准步骤执行',[n('AI 整理维修报告',[n('轮机长审阅结果',[ref('继续观察 → 效果观察','observation'),ref('派发复查 ↩ 现场核实',prefix+'check'),end()])]),ref('实际未完成 → 受阻分支','blocked')])],{id:prefix+'repair'});
const decisions=[n(tracking?'趋势不支持 / 原因尚待核实':'未定位原因 / 证据不足',[ref('继续排查 ↩ 下一轮任务',prefix+'check')]),n('有具体异常与处理依据',[work]),...(tracking?[n('异动已核实（不等同部件故障）',[n('提前维保',[n('选择原维保计划 + 正式工单',[n('选择靠港窗口、执行人及期限',[n('派发维保任务 → 按计划执行',[n('AI 整理维保作业报告',[n('轮机长审阅',[ref('继续观察 → 效果观察','observation'),ref('派发复查 ↩ 现场核实',prefix+'check'),end()])]),ref('实际未完成 → 受阻分支','blocked')])])])])])]:[]),n('暂不处置 / 异常自行回落',[ref('核实后继续观察 → 效果观察','observation')]),n('已有结束依据',[end('首轮回交后即可人工闭环')])];
return n(names[type],[n('轮机长首次决策',[n('确认误报',[n('填写依据',[end('误报闭环')])]),n('派发排查',[n('审阅 / 对话修改 AI 排查建议',[n('指定执行人、范围、时限',[n('现场核实（排查 / 复查）',[n('填写实际结果、备注与汇总',[n('AI 流式整理报告',[n('做过什么 / 发现什么 / 不能确认什么',[],{tone:'small'}),n('排查回交 / 复查发现异常',[n('轮机长决策',decisions,{id:prefix+'decision'})]),n('复查未再现异常',[n('轮机长审阅',[ref('继续观察 → 效果观察','observation'),ref('仍需核实 ↩ 再次复查',prefix+'check'),end()])])]),ref('条件受限未执行 → 受阻分支','blocked')])],{id:prefix+'check'})])])])])],{tone:'type',id:type});}
const shared=[
n('效果观察（共用）',[n('适用周期',[n('报警 / 预警：两小时'),n('异动跟踪：一周')]),n('核对本次开始后的数据与工况',[n('无数据 / 缺测 / 不适用工况',[n('AI 提示证据缺口',[ref('等待有效数据 ↩ 继续观察','observation')])]),n('数据有效、工况可比',[n('未满周期、平稳',[ref('等待本周期完成 ↩ 观察','observation')]),n('周期已满、平稳且原异常未复现',[n('AI 建议闭环',[n('轮机长确认',[end()])])]),n('偏差持续 / 扩大 / 复发',[ref('AI 建议复查 ↩ 现场核实','check-link')])])]),n('轮机长可不采纳 AI 建议',[end('说明依据，人工闭环'),ref('派发复查 ↩ 现场核实','check-link'),n('核实后观察：已有处理依据',[ref('派发维修 ↩ 维修任务','repair-link')]),n('修后观察：需再次处理',[ref('先复查，再按发现决定维修','check-link')]),ref('到期后继续观察 ↩ 新周期','observation')])],{tone:'type',id:'observation'}),
n('任务受阻（共用）',[n('实际未完成 / 不具备实施条件',[n('先提交阶段报告，保留已完成项',[n('轮机长决定',[n('等待条件，保留原任务',[n('条件具备，确认恢复',[n('原任务编号与步骤保持不变',[n('补做、再次提交',[n('第 1 次报告：原事实；第 2 次：恢复后事实'),n('以本次记录判断当前状态',[ref('回到轮机长审阅与决策','decision-link')])])])])]),n('另派剩余作业',[n('只带入需补做项目，新建任务',[ref('排查无定位异常 ↩ 继续排查','check-link'),ref('已有异常 / 维修受阻 ↩ 剩余维修','repair-link')])]),n('终止未执行部分',[n('记录原因与后续安排（不自动闭环）',[ref('需要再核实 ↩ 派发复查','check-link'),end('另行确认事件闭环')])]),n('说明剩余事项并闭环',[end('等待期间先终止未执行部分')])])])]),n('不适用 ≠ 未完成',[n('本项无需执行，不等待、不恢复、不补做',[ref('按已反馈路径 → 审阅与决策','decision-link')]),n('报告保留“不适用”，不写成已维修',[],{tone:'small'})])],{tone:'type',id:'blocked'}),
n('贯穿全程',[n('同步岸基',[n('仅发送事件资料，不改变当前流程'),n('闭环前：决策选项；闭环后：右上角入口')]),n('报告补充',[n('本人对话补充 → 核对修订稿 → 写入原报告'),n('按本次记录重新整理 AI → 原稿留存'),n('不创建新任务，不增加提交次数')]),n('人工闭环',[n('完整闭环报告：异常 → 怎么查 → 原因 → 怎么修 → 效果'),n('保留全部任务、各次报告、未实施范围与决策'),n('关闭处置表单，仅保留回看与岸基同步')])],{tone:'type'})
];
const svg=document.getElementById('tree'),viewport=document.getElementById('viewport'),NS='http://www.w3.org/2000/svg',measure=document.createElement('canvas').getContext('2d');measure.font='13px "Microsoft YaHei", sans-serif';let selected='all',activeType='alarm',zoom=1,nodes=[],totalWidth=1,totalHeight=1;
function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}
function render(){const types=selected==='all'?['alarm','warning','tracking']:[selected],root=n('事件 → 人工闭环',[...types.map(eventBranch),...shared],{tone:'root'});nodes=[];let cursor=30;
function layout(node,x,parent){node.x=x;node.width=Math.ceil(measure.measureText(node.text).width)+24;node.parent=parent;nodes.push(node);if(node.children.length){node.children.forEach(c=>layout(c,x+node.width+45,node));node.y=(node.children[0].y+node.children.at(-1).y)/2}else{node.y=cursor;cursor+=40}return node}layout(root,26,null);totalWidth=Math.max(...nodes.map(d=>d.x+d.width))+35;totalHeight=cursor+20;svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${totalWidth} ${totalHeight}`);
for(const d of nodes)if(d.parent){const p=d.parent,x=p.x+p.width,bend=x+22;svg.append(el('path',{class:'edge',d:`M${x} ${p.y} H${bend} V${d.y} H${d.x}`}))}
for(const d of nodes){let ancestor=d;while(ancestor&&!['alarm','warning','tracking'].includes(ancestor.id))ancestor=ancestor.parent;const group=el('g',{class:'node '+(d.tone||''),transform:`translate(${d.x} ${d.y-15})`,...(d.id?{'data-node-id':d.id}:{}),...(d.target?{tabindex:0,role:'button','data-target':d.target,'data-origin':ancestor?.id||'','aria-label':d.text}:{})});group.append(el('rect',{width:d.width,height:30,rx:4}));group.append(el('text',{x:12,y:15},d.text));group.append(el('title',{},d.text));svg.append(group)}document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(selected===b.dataset.type)));applyZoom();viewport.scrollTo(0,0)}
function applyZoom(){svg.style.width=totalWidth*zoom+'px';svg.style.height=totalHeight*zoom+'px';document.getElementById('scale').value=Math.round(zoom*100)+'%'}
function setZoom(value){const old=zoom;zoom=Math.max(.25,Math.min(1.75,value));const cx=viewport.scrollLeft+viewport.clientWidth/2,cy=viewport.scrollTop+viewport.clientHeight/2;applyZoom();viewport.scrollTo(cx*zoom/old-viewport.clientWidth/2,cy*zoom/old-viewport.clientHeight/2)}
function jump(target,origin){if(origin)activeType=origin;const active=selected==='all'?activeType:selected;target=target==='check-link'?active+'-check':target==='repair-link'?active+'-repair':target==='decision-link'?active+'-decision':target;const node=nodes.find(n=>n.id===target),g=svg.querySelector(`[data-node-id="${target}"]`);if(!node||!g)return;svg.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));g.classList.add('active');viewport.scrollTo({left:Math.max(0,node.x*zoom-viewport.clientWidth*.2),top:Math.max(0,node.y*zoom-viewport.clientHeight/2),behavior:'smooth'});setTimeout(()=>g.classList.remove('active'),2200)}
document.addEventListener('click',e=>{const type=e.target.closest('[data-type]'),target=e.target.closest('[data-target]');if(type){selected=type.dataset.type;render()}if(target)jump(target.dataset.target,target.dataset.origin)});svg.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.dataset.target){e.preventDefault();jump(e.target.dataset.target,e.target.dataset.origin)}});
document.getElementById('in').onclick=()=>setZoom(zoom+.1);document.getElementById('out').onclick=()=>setZoom(zoom-.1);document.getElementById('reset').onclick=()=>setZoom(1);document.getElementById('fit').onclick=()=>setZoom(Math.min(1,(viewport.clientWidth-20)/totalWidth));viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?.05:-.05))}},{passive:false});let drag;viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0&&!e.target.closest('[data-target]')){drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')}});viewport.addEventListener('pointermove',e=>{if(drag)viewport.scrollTo(drag.left+drag.x-e.clientX,drag.top+drag.y-e.clientY)});viewport.addEventListener('pointerup',()=>{drag=null;viewport.classList.remove('dragging')});viewport.addEventListener('pointercancel',()=>{drag=null;viewport.classList.remove('dragging')});render();setZoom(Math.max(.65,Math.min(1,(viewport.clientWidth-20)/totalWidth)));
</script></body></html>
